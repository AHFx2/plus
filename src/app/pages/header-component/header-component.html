<header class="relative">
    <div class="bg-white md:hidden fixed z-999999 h-fit w-full shadow-md mb-5">
        <div class="container flex justify-between items-center my-4">
            <div class="flex-1"><img src="https://pulseapp.com/img/pulse-logo.svg" alt=""></div>
            <div (click)="toggle()" class="flex-1 text-end"><i class="fa-solid fa-bars text-3xl text-primary"></i></div>
        </div>
        <div class="container relative bg-green-100 h-[100vh] block pt-10" [class.hidden]="!toggled">
            <ul class="flex justify-between flex-col flex-1 gap-3 text-4xl font-black">
                <li><a href="#" class="text-color font-bold">Features</a></li>
                <li><a href="#" class="text-color font-bold">Customer Stories</a></li>
                <li><a routerLink="/Pricing" routerLinkActive="text-black" class="text-color font-bold">Pricing</a></li>
                <li><a href="#" class="text-color font-bold">Blog</a></li>
                <li><a href="#" class="text-color font-bold">Contact</a></li>
                <li><a href="#" class="text-color font-bold">Support</a></li>
                <li><a href="#" class="main-animation bg-linear-to-br from-secondary to-primary text-lg py-2 px-4">Sign Up</a></li>
            </ul>
        </div>
    </div>
    <div class="container hidden md:block">
        <nav class="flex justify-between felx items-center py-4 md:py-12 md:gap-[3rem]">
            <div class=""><img src="https://pulseapp.com/img/pulse-logo.svg" alt=""></div>
            <ul class="flex justify-between gap-8 lg:gap-[3rem] items-center">
                <li><a href="#" class="text-color font-bold">Features</a></li>
                <li><a href="#" class="text-color font-bold">Customer Stories</a></li>
                <li><a routerLink="/pricing" routerLinkActive="text-white" class="text-color font-bold">Pricing</a></li>
                <li><a href="#" class="text-color font-bold">Blog</a></li>
                <li class="main-animation inline-block w-fit border-1 px-5 py-2">Sign Up</li>
            </ul>
        </nav>
    </div>
</header>
